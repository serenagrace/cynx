name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Mirror the Pi layout: the unit's ExecStart is env/bin/cynx.
      - name: Install
        run: |
          python -m venv env
          env/bin/python -m pip install --upgrade pip
          env/bin/python -m pip install -e ".[dev]"

      - name: Check formatting
        run: |
          env/bin/python -m isort --check-only .
          env/bin/python -m black --check .

      # Fake USB backend and loopback sockets; no hardware, root or secrets.
      - name: Run tests
        run: env/bin/python -m pytest

      - name: Build and check package
        run: |
          env/bin/python -m build
          env/bin/python - <<'PY'
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheel = Path(f"dist/cynx-{version}-py3-none-any.whl")
          sdist = Path(f"dist/cynx-{version}.tar.gz")
          names = set(zipfile.ZipFile(wheel).namelist())
          for name in ("cynx/server.py", "cynx/nx/gadget.py"):
              assert name in names, name
          entry = f"cynx-{version}.dist-info/entry_points.txt"
          assert "cynx = cynx.__main__:main" in zipfile.ZipFile(wheel).read(entry).decode()
          members = {name.split("/", 1)[1] for name in tarfile.open(sdist).getnames() if "/" in name}
          for name in (
              "bin/install_service.sh",
              "bin/service_usb.sh",
              "systemd/cynx.service.in",
              "config.example.yaml",
              ".env.example",
              "docs/protocol.md",
          ):
              assert name in members, name
          assert ".env" not in members and "config.yaml" not in members
          print(f"Built and checked cynx {version}")
          PY

      - name: Check shell scripts
        run: |
          for script in bin/*.sh; do bash -n "$script"; done
          shellcheck bin/*.sh

      - name: Validate systemd unit
        run: |
          sudo install -D -m 0755 bin/service_usb.sh /usr/local/libexec/cynx/service_usb.sh
          bin/install_service.sh --print-unit > "$RUNNER_TEMP/cynx.service"
          systemd-analyze verify "$RUNNER_TEMP/cynx.service"
